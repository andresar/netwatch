services:
  netwatch:
    build: .
    container_name: netwatch
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      - NETWATCH_SUBNET=${NETWATCH_SUBNET:-192.168.1.0/24}
      - NETWATCH_PORT=${NETWATCH_PORT:-8080}
      - NETWATCH_SCAN_TIMEOUT=${NETWATCH_SCAN_TIMEOUT:-30s}
      - NETWATCH_PING_CONCURRENCY=${NETWATCH_PING_CONCURRENCY:-32}
      - NETWATCH_DNS_TIMEOUT=${NETWATCH_DNS_TIMEOUT:-3s}
    restart: unless-stopped
